name: Update supplier catalogue

on:
  schedule:
    - cron: "17 17 * * *"   # daily, ~4:17 am Sydney (summer time)
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Fraterworks catalogue
        run: python3 scripts/build_catalog.py --supplier fraterworks

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- catalog; then
            echo "No catalogue changes."
            exit 0
          fi
          git config user.name  "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          git commit -m "Update catalogue $(date -u +%Y-%m-%d)"
          git push
